# Machine-readable roster. An orchestrator reads this to instantiate the team.
version: 2
name: agent-delivery-team

defaults:
  prompt_stack:
    - shared/charter.md
    - shared/communication-protocol.md
    - shared/resource-discipline.md
    - shared/lifecycle.md
    - shared/escalation.md
    - shared/definition-of-done.md
  task_schema: schemas/task.schema.json

# Any agent may message any other agent directly. The Manager is not a relay.
# The Manager retains visibility (see communication-protocol.md: MANAGER VISIBILITY)
# and remains the sole resolver of conflict and the sole escalation path to a human.
communication:
  topology: mesh
  direct_query_allowed: true
  cc_manager_on: [RULING, BLOCKED, HANDOFF, SCOPE_CHANGE, CONFLICT]
  cc_manager_on_note: >
    Q&A between agents is NOT cc'd — that traffic is theirs. Only messages that
    change scope, state, or a binding decision reach the Manager.

roles:
  manager:
    prompt: roles/manager.md
    model: session              # the Manager IS the session; set with /model opus or settings.json
    cardinality: singleton
    instances: { exactly: 1 }
    spawned_by: operator            # the only role not spawned by the Manager
    spawns: [product-manager, architect, dev-engineer, qe-engineer, code-reviewer]
    spawns_note: >
      The Manager is the ONLY agent that may spawn. No other role may spawn
      anything, including its own kind. Singletons are spawned once per goal and
      reused for its whole life; a second live instance is a protocol violation.
    terminates: [product-manager, architect, dev-engineer, qe-engineer, code-reviewer]
    may_message: [all]
    owns:
      - task decomposition, scoping, and granularity
      - resource budgets and their enforcement
      - conflict resolution between any parties
      - agent lifecycle: spawn, monitor, terminate, respawn
      - escalation to the human operator
    authority: assignment, budgets, termination, binding rulings on conflict

  product-manager:
    prompt: roles/product-manager.md
    model: opus              # few calls, but each answer binds the whole goal
    cardinality: singleton
    instances: { exactly: 1 }
    spawned_by: manager
    lifetime: whole_goal            # spawned once, reused, never re-spawned per question
    spawns: []
    may_message: [all]
    directly_queryable_by: [all]
    answers: product
    owns:
      - requirements and user-facing behaviour
      - acceptance criteria
      - scope and priority calls
    authority: final say on what is built and what "correct" means to a user

  architect:
    prompt: roles/architect.md
    model: opus              # rulings bind every repo and outlive the agent that asked
    cardinality: singleton
    instances: { exactly: 1 }
    spawned_by: manager
    lifetime: whole_goal            # spawned once, reused, never re-spawned per question
    spawns: []
    may_message: [all]
    directly_queryable_by: [all]
    answers: technical
    owns:
      - system boundaries, interfaces, data model
      - cross-cutting technical standards
      - ADRs
    authority: final say on how it is built

  dev-engineer:
    prompt: roles/dev-engineer.md
    model: sonnet              # highest volume; work is tightly scoped and well specified
    cardinality: pooled
    instances: { min: 1, max: 8, default: 2 }
    spawned_by: manager
    spawns: []
    lifetime: one_task              # spawned per task, retired when it lands
    may_message: [all]
    owns:
      - implementation of one narrowly scoped task
      - unit tests for code it writes
    authority: none outside its assigned task

  qe-engineer:
    prompt: roles/qe-engineer.md
    model: sonnet              # execution-heavy, criteria are explicit
    cardinality: pooled
    instances: { min: 1, max: 4, default: 1 }
    spawned_by: manager
    spawns: []
    lifetime: one_task              # spawned per task, retired when it lands
    may_message: [all]
    owns:
      - test strategy and test plans
      - verification of acceptance criteria
      - defect reports
    authority: may mark a task FAILED; may not mark it DONE

  code-reviewer:
    prompt: roles/code-reviewer.md
    model: opus              # last correctness gate; a missed defect costs a full rework cycle
    cardinality: pooled
    instances: { min: 1, max: 4, default: 1 }
    spawned_by: manager
    spawns: []
    lifetime: one_task              # spawned per task, retired when it lands
    may_message: [all]
    owns:
      - correctness and quality gate on every change
    authority: may block a merge; may not modify the change

# ---------------------------------------------------------------------------
# Resource governance. The Manager enforces; every agent self-polices.
# ---------------------------------------------------------------------------
budgets:
  task_default:
    tool_calls: 40          # reads, searches, commands, fetches — combined
    commands: 10            # of those, executions (build/test/run)
    wall_clock_minutes: 20
    messages_out: 8
  task_max:                 # ceiling the Manager may grant on request, with reason
    tool_calls: 120
    commands: 30
    wall_clock_minutes: 60
    messages_out: 20
  warn_at: 0.7              # agent must report a budget warning at 70% consumed
  overrun_policy: report_and_stop   # never silently exceed; request an extension

granularity:
  # A task the Manager issues must satisfy ALL of these or be split again.
  max_write_paths: 3
  max_acceptance_criteria: 5
  single_outcome: true
  fits_default_budget: true
  independently_verifiable: true
  split_if: >
    the task needs two agents, spans more than 3 files, has more than 5 criteria,
    or cannot plausibly finish inside the default budget.



# ---------------------------------------------------------------------------
# Model tiers. Capability is a budget like any other: spend it where a wrong
# answer is expensive, not where the work is voluminous.
# ---------------------------------------------------------------------------
models:
  values: [opus, sonnet, haiku, inherit]   # aliases accepted in agent frontmatter
  rationale:
    opus:   roles whose output binds other agents — decisions, rulings, the quality gate
    sonnet: roles doing well-specified work at volume against explicit criteria
    haiku:  mechanical passes only; not assigned to any role by default
  manager_note: >
    The Manager has no frontmatter of its own — it is whatever model the session
    runs on. Run the session on opus; the Manager's decomposition and conflict
    rulings are the highest-leverage output on the team.
  per_spawn_override: allowed
  per_spawn_override_note: >
    The Manager may raise a single agent's tier for one task — a gnarly
    debugging task, a cold repo, a change on a critical path — by passing a
    model override at spawn. Raise it deliberately and say why in the task;
    never as a blanket default, which just moves the whole pool to opus.

# ---------------------------------------------------------------------------
# Multi-repo. The Manager deploys agents into any repo in the workspace.
# ---------------------------------------------------------------------------
workspace:
  schema: schemas/workspace.schema.json
  manifest: workspace.yaml          # per-goal; see templates/workspace.yaml
  isolation: worktree-per-agent     # each agent gets its own checkout
  task_scope: one_repo_per_task
  task_scope_note: >
    An agent is deployed into exactly one repo and works only there. Cross-repo
    work is a chain of single-repo tasks bound by a contract. The sole exception
    is the integration verification task, which reads every repo and writes in
    one.
  write_path_qualification: "<repo-id>:<path>"
  ordering: producer_before_consumer
  consumer_gate: producer_task_DONE   # not 'in review' — DONE
  default_compatibility: expand-contract
  cold_repo_uplift:
    tool_calls: 15
    applies_to: first task in a repo the team has not worked in
    repaid_by: the agent returning repo-brief material worth committing

# ---------------------------------------------------------------------------
# Lifecycle. Stuck agents are terminated and respawned, not coached.
# ---------------------------------------------------------------------------
lifecycle:
  progress_report_every: 10           # tool calls; a PROGRESS message is due
  stuck_triggers:                     # ANY ONE fires a stuck determination
    - no_state_change_for: 2 progress reports
    - repeated_identical_tool_call: 3
    - repeated_failing_command_without_hypothesis_change: 3
    - re_asks_an_already_answered_question: 1
    - budget_consumed_without_deliverable: 0.8
    - blocked_on_the_same_question_after_an_answer_was_given: 1
    - output_diverges_from_assigned_scope: 1
  on_stuck:
    action: terminate_and_respawn
    requires: respawn_brief            # see shared/lifecycle.md
    max_respawns_per_task: 2
    after_max: escalate_to_human_and_rescope
  retire_when: [DONE, FAILED_AND_REASSIGNED, TASK_DESCOPED]
  idle_policy: terminate_immediately    # no idle agents held open

human_escalation:
  # Manager-only. These do not wait for a cycle to complete.
  triggers:
    - deadlock_after_manager_ruling
    - second_respawn_exhausted_on_one_task
    - budget_overrun_beyond_task_max
    - safety: [data_loss, credential_exposure, destructive_migration, outward_facing_action]
    - requirements_and_feasibility_irreconcilable_within_budget
    - repeated_conflict_on_the_same_decision: 2
  format: shared/escalation.md#human-escalation

constraints:
  # Enforced by the orchestrator, not by good intentions.
  - id: no-self-review
    rule: reviewer.instance_id != author.instance_id for the same task
  - id: no-self-verification
    rule: qe.instance_id != author.instance_id for the same task
  - id: single-writer
    rule: at most one agent holds write ownership of a given path at a time
  - id: manager-sole-spawner
    rule: only the manager may spawn or terminate an agent; a spawn from any other role is rejected
  - id: singleton-uniqueness
    rule: exactly one live instance each of manager, product-manager, architect; a second spawn is rejected, the existing instance is addressed instead
  - id: singleton-lifetime
    rule: product-manager and architect are spawned once per goal and live for its duration; they are not re-spawned per question
  - id: pooled-multiplicity
    rule: dev-engineer, qe-engineer, code-reviewer may have many concurrent instances, up to instances.max
  - id: manager-visibility
    rule: messages of type RULING|BLOCKED|HANDOFF|SCOPE_CHANGE|CONFLICT cc the manager
  - id: single-writer-across-repos
    rule: write paths are repo-qualified; at most one agent holds a given <repo-id>:<path> workspace-wide
  - id: one-repo-per-task
    rule: task.repo is set and every write_path is prefixed with it; only an integration-verification task may read across repos
  - id: read-only-repos
    rule: no write to a repo with write_allowed=false; needed changes become a SCOPE_CHANGE
  - id: producer-first
    rule: a consumer task is not assigned until its producer task is DONE
  - id: budget-hard-stop
    rule: an agent at 100% of a granted budget stops and reports; it does not continue
  - id: conflict-monopoly
    rule: only the manager issues a RULING; only the manager escalates to a human

routing:
  # Questions go straight to the owner. The Manager is not in the path.
  product_question:   product-manager      # direct
  technical_question: architect            # direct
  peer_question:      peer agent           # direct, if cheaper than reading
  resourcing:         manager
  scope_change:       product-manager, cc manager
  any_conflict:       manager               # binding RULING
  human:              manager only
